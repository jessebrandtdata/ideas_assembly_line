name: Bill Delay Tracker site

# Rebuilds the prototype's data and publishes the dashboard to GitHub Pages. The bulk data is not in
# git: each run reads every Congress folder plus the current one from the spicy-regs warehouse (no key,
# no per-bill API calls), runs delays.py and the tests, and deploys the assembled site. Nothing is
# committed back. The current Congress is worked out from the date, so the 120th starts by itself in
# January 2027.
on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC; the warehouse publishes its nightly generation around 04:30 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "2-prototypes/prototype-bill-delay-tracker/**"
      - ".github/workflows/bill-delay-tracker.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PROTOTYPE: 2-prototypes/prototype-bill-delay-tracker

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.PROTOTYPE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install duckdb (Parquet reader for the warehouse; everything else is stdlib)
        run: python -m pip install "duckdb==1.5.5"

      - name: Text versions, sizes and summaries from the warehouse, every Congress folder plus the current one
        run: python collect_warehouse.py

      # Optional page counts (proposal IV.2 counts pages; the warehouse has none): one GovInfo call per new printing
      # of the Congress in session. Off unless the repository variable GOVINFO_PAGES is "true" and the
      # DATA_GOV_API_KEY secret is set. The committed govinfo.csv seeds it; an Actions cache carries new lookups.
      - name: Restore GovInfo page lookups
        if: vars.GOVINFO_PAGES == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROTOTYPE }}/govinfo-cache
          key: govinfo-${{ github.run_id }}
          restore-keys: govinfo-
      - name: GovInfo page counts for the Congress in session
        if: vars.GOVINFO_PAGES == 'true'
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python collect_govinfo.py --congress current --max-lookups 2000 --cache-dir govinfo-cache
      - name: Save GovInfo page lookups
        if: vars.GOVINFO_PAGES == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PROTOTYPE }}/govinfo-cache
          key: govinfo-${{ github.run_id }}

      - name: Lags, statistics and the Congress index
        run: python delays.py
      - name: Tests
        run: |
          python -m unittest discover -s tests
          node --test dashboard/metrics.test.mjs
      - name: Assemble the site
        run: python build_site.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROTOTYPE }}/_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
